# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
D3DDevice_SetTextureStageStateNotInline = ["ecx", "eax", "edx"]  # by hand: type compared at 0x2BA2F0, stage shl 5 at 0x2BA306
CDevice_KickOff = ["ecx"]  # reads ecx ebx, pops 0
D3DDevice_SelectVertexShader = ["eax", "ebx"]  # reads eax ebx, pops 0
D3D_BlockOnResource = ["eax"]  # by hand, was listed as IsBusy
D3D_InternalRelease = ["esi"]  # reads esi, pops 0
D3D_MakeRequestedSpace = ["stack", "eax"]  # reads eax, pops 4

# By hand. CDirectSoundStream SetMode (see src/game/hooks.cpp): only reached by the jmp at 0x29384F, so it was decoded
# inside that stub; as its own function the hook can replace it.
[[function]]
