name: Linux package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Game assets and generated code are never committed. Keep the hosted CI
      # honest: without assets/default.xbe the configure step must fail with the
      # explicit guard message in platform/linux/CMakeLists.txt, not a confusing
      # file(SHA1) error. Complete checkouts build and package normally.
      - name: Check for game assets
        id: assets
        shell: bash
        run: |
          if [ -f assets/default.xbe ] && compgen -G 'generated/game/x86_recomp.*.cpp' > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Linux package build skipped::assets/default.xbe and generated/game code are not in this repository. Provide both to build the package; the configure guard is checked instead."
          fi

      - name: Verify missing-XBE guard
        if: steps.assets.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if cmake -S platform/linux -B build/guard -G Ninja -DCMAKE_BUILD_TYPE=Release > guard.log 2>&1; then
            echo "::error::platform/linux configured without assets/default.xbe"
            exit 1
          fi
          grep -q 'Missing game image' guard.log
          echo "Configure fails with the expected clear message when assets/default.xbe is absent."

      - name: Install build dependencies
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils cmake ninja-build pkg-config \
            libvulkan-dev libshaderc-dev libshaderc1 \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libdrm-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev

      # Ubuntu 24.04 has no libsdl3-dev, so build the same pinned SDL3 release
      # the Windows SDK uses. Static linking keeps the tarball self-contained.
      - name: Build and install SDL3
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL-build" --parallel
          sudo cmake --install "$RUNNER_TEMP/SDL-build"

      - name: Configure
        if: steps.assets.outputs.available == 'true'
        run: cmake -S platform/linux -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.assets.outputs.available == 'true'
        run: cmake --build build/linux --parallel

      - name: Package
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          scripts/package-linux.sh build/linux dist

      - name: Verify package contents
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NAME=TrueCrimeNYC-linux-x86_64
          TARBALL=dist/$NAME.tar.gz
          test -f "$TARBALL"
          (cd dist && sha256sum -c "$NAME.tar.gz.sha256")
          tar -tzf "$TARBALL" > package-contents.txt
          for entry in \
            "$NAME/TrueCrimeNYC" \
            "$NAME/lib/libshaderc.so.1" \
            "$NAME/README.md" \
            "$NAME/README-LINUX.md" \
            "$NAME/CHANGELOG.md" \
            "$NAME/BUILD.txt" \
            "$NAME/THIRD_PARTY.txt" \
            "$NAME/LICENSES/XboxXBE-Recomp-LICENSE.txt" \
            "$NAME/LICENSES/Project-LICENSE.txt" \
            "$NAME/assets/PUT-THE-GAME-HERE.txt"; do
            grep -Fqx "$entry" package-contents.txt || { echo "::error::missing $entry"; exit 1; }
          done
          if grep -Eiq '\.(xbe|iso)$' package-contents.txt; then
            echo "::error::package contains game assets or a disc image"
            exit 1
          fi
          unexpected=$(grep -E "^$NAME/assets/" package-contents.txt \
            | grep -Fvx "$NAME/assets/" \
            | grep -Fvx "$NAME/assets/PUT-THE-GAME-HERE.txt" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected files under assets/:"
            echo "$unexpected"
            exit 1
          fi
          echo "Package contents:"
          cat package-contents.txt

      - name: Upload package
        if: steps.assets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TrueCrimeNYC-linux-x86_64
          path: |
            dist/TrueCrimeNYC-linux-x86_64.tar.gz
            dist/TrueCrimeNYC-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
